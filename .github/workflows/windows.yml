name: windows-2025

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Reference on Windows
        shell: pwsh
        run: npm run build-reference
      - name: Upload bootstrap Reference
        uses: actions/upload-artifact@v7
        with:
          name: windows-reference-bootstrap
          path: verification/bootstrap-output/
          if-no-files-found: error
          retention-days: 1
